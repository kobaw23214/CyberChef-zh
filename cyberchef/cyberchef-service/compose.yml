# CyberChef 汉化版 生产编排(单容器一体化)
#
# 一个容器同时提供:
#   :8080  Web 界面(nginx 静态托管,含 MCP 管理面板)
#   :8090  MCP 服务(Streamable HTTP /mcp 给 agent;/api/* 管理接口给面板,
#          无认证,仅限内网)
#
# 镜像由 image/ 下的 tar.gz 离线导入(deploy.sh load/start 自动处理),
# 不从 registry 拉取。tag 与端口绑定见 .env;compose 工程名由 deploy.sh
# 固定为 cyberchef-service。

services:
  cyberchef:
    image: ${CYBERCHEF_IMAGE}
    container_name: cyberchef
    restart: unless-stopped
    ports:
      - "${CYBERCHEF_BIND}:8080"
      - "${MCP_BIND}:8090"
    volumes:
      # MCP 操作启停状态与调用记录持久化
      - ./mcp-data:/data
    security_opt:
      - no-new-privileges:true
    # 根文件系统只读;nginx 与 node 的可写路径都在 /tmp 与 /data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:8080/ && wget -q --spider http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
